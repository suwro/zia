<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <title>{{.domainName}}</title>
</head>
<body>
<style>
  body {
    font-family: "Nunito", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f0f0f0; /* Optional: fundal ușor gri */
  }
  .content {
    min-width: 300px;
    min-height: 150px;
    background-color: white;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Umbra ușoară */
    padding: 20px;
    box-sizing: border-box; /* Include padding în dimensiuni */
    text-align: center;
  }
  .red {
    color: darkred;
  }

  .loading {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 50px auto;
  }

  .ball {
    width: 10px;
    height: 10px;
    background-color: #4a90e2;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out;
    animation-fill-mode: both;
  }

  .ball:nth-child(2) {
    animation-delay: 0.2s;
  }

  .ball:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes bounce {
    0%, 100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-20px);
    }
  }
  .message{
    display: none;
  }
</style>
  <div class="content">
    <div class="loading">
      <div class="ball"></div>
      <div class="ball"></div>
      <div class="ball"></div>
    </div>
    <div class="message">
      <h1>Welcome to<br/>
        <span class="red">{{.domainName}}!</span>
      </h1>
      <p style="text-align: center;">
        This is a placeholder page for current domain, your IP address is:<br/>
        <span class="red" style="font-weight: bold">{{.ipAddress}}</span>.
      </p>
    </div>
  </div>
  <script type="text/javascript">
    // afiseaza mesaj - dupa incarcarea paginii
    window.onload = function() {
      // Ascunde loading
      document.querySelector('.loading').style.display = 'none';
      // Afișează mesajul
      document.querySelector('.message').style.display = 'block';
    };
  </script>
</body>
</html>
